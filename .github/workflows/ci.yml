name: CI - Kiểm Thử Tự Động & Đóng Gói (House Price AI)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test_and_build:
    name: Run Unit Tests & Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 3. Cài đặt thư viện dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Huấn luyện thử nghiệm mô hình ML
        run: |
          python -m app.ml.train

      - name: 5. Chạy bộ kiểm thử tự động (Unit & Integration Tests)
        run: |
          pytest -v tests/

      - name: 6. Kiểm tra tính hợp lệ của Dockerfile Build
        run: |
          docker build -t house-price-ai:test .
